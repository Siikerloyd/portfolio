name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Force Production Environment
        run: |
          cat > .env.local.php << 'EOF'
          <?php return [
            'APP_ENV' => 'prod',
            'APP_DEBUG' => '0',
            'APP_SECRET' => '8f7b3c29e1a4d65019842bf689e47201',
            'DATABASE_URL' => 'sqlite:///%kernel.project_dir%/var/data.db',
            'MESSENGER_TRANSPORT_DSN' => 'doctrine://default?auto_setup=0',
            'MAILER_DSN' => 'null://null',
          ];
          EOF

      - name: Build Static Site
        run: |
          php bin/console cache:clear --env=prod
          php bin/console assets:install public --env=prod

          php -S 127.0.0.1:8000 -t public &
          sleep 4

          curl -f -s http://127.0.0.1:8000/ -o public/index.html
          kill %1

          # Fix paths for GitHub Pages subpath (/portfolio/)
          sed -i 's|href="/css/|href="css/|g' public/index.html
          sed -i 's|src="/js/|src="js/|g' public/index.html
          sed -i 's|href="/cv/|href="cv/|g' public/index.html

          touch public/.nojekyll
          rm -f public/index.php

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
